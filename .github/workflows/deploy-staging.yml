name: Deploy Staging

on:
  workflow_dispatch:

  push:
    branches:
      - staging

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy Staging Environment
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: staging

    env:
      NEXT_PUBLIC_APP_ENV: staging
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN }}
      NEXT_PUBLIC_SOCKET_SERVER_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_SERVER_URL }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      IMAGE_TAG: staging-${{ github.sha }}
      # Runtime-only (never build args): the presign route handler at
      # src/app/api/file-uploads/presigned-url reads these on the server. They
      # must NOT be NEXT_PUBLIC_ or they would ship to the browser.
      #
      # Deliberately NOT named AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY here.
      # `configure-aws-credentials` exports those names for later steps, and a
      # job-level env of the same name shadows them — the ECR login would then
      # use these S3-only upload keys instead of the assumed deploy role and
      # fail with "not authorized to perform ecr:GetAuthorizationToken".
      # They are renamed back to the standard names on the `docker run` line.
      UPLOAD_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      UPLOAD_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      # Static access keys, the same way mapanytime-api authenticates.
      #
      # Do NOT swap this for `role-to-assume: ${{ secrets.AWS_ROLE_ARN }}`:
      # that ARN is `mapanytime-role`, the EC2 *instance* profile, whose policy
      # is pull-only — assuming it makes `docker push` fail with
      # "not authorized to perform ecr:InitiateLayerUpload".
      #
      # The key pair here must be the one the API repo deploys with (it can
      # push to ECR and call iam:PutRolePolicy). The pair in mapanytime-api/.env
      # is a different, S3-only user (`style-mirror-s3-dev`) and will fail.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Prefer the registry returned by login over secrets.ECR_REGISTRY —
      # a typo / https:// prefix / wrong account ID in that secret causes
      # `docker push` to fail with "lookup … no such host".
      - name: Export ECR registry
        run: echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            --build-arg NEXT_PUBLIC_SITE_URL="$NEXT_PUBLIC_SITE_URL" \
            --build-arg NEXT_PUBLIC_APP_ENV="$NEXT_PUBLIC_APP_ENV" \
            --build-arg NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN="$NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN" \
            --build-arg NEXT_PUBLIC_SOCKET_SERVER_URL="$NEXT_PUBLIC_SOCKET_SERVER_URL" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:staging-latest" \
            .

      - name: Push image to ECR
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:staging-latest"

      # Pull / stop / remove / run / cleanup all happen inside one SSH session
      # so the deploy script can share shell state (the health-check result)
      # across those sub-steps — splitting them into separate ssh-action
      # steps would reconnect SSH each time and lose that shared state.
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          envs: AWS_REGION,ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,NEXT_PUBLIC_API_URL,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_APP_ENV,NEXT_PUBLIC_SOCKET_SERVER_URL,UPLOAD_AWS_ACCESS_KEY_ID,UPLOAD_AWS_SECRET_ACCESS_KEY,AWS_S3_BUCKET_NAME

          script: |
            set -euo pipefail

            IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

            CONTAINER="frontend-staging"
            NEW_CONTAINER="frontend-staging-new"

            HEALTH_PORT=3001

            # Amazon ECR Login — the EC2 host authenticates independently of
            # the GitHub Actions runner (requires its own IAM instance role).
            aws ecr get-login-password \
              --region "$AWS_REGION" \
              | docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

            # Docker Pull
            docker pull "$IMAGE"

            docker rm -f "$NEW_CONTAINER" 2>/dev/null || true

            # Docker Run — new container on a temporary port for health-checking
            docker run -d \
              --name "$NEW_CONTAINER" \
              -p "$HEALTH_PORT:3000" \
              -e NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
              -e NEXT_PUBLIC_SITE_URL="$NEXT_PUBLIC_SITE_URL" \
              -e NEXT_PUBLIC_APP_ENV="$NEXT_PUBLIC_APP_ENV" \
              -e NEXT_PUBLIC_SOCKET_SERVER_URL="$NEXT_PUBLIC_SOCKET_SERVER_URL" \
              -e AWS_REGION="${AWS_REGION:-}" \
              -e AWS_ACCESS_KEY_ID="${UPLOAD_AWS_ACCESS_KEY_ID:-}" \
              -e AWS_SECRET_ACCESS_KEY="${UPLOAD_AWS_SECRET_ACCESS_KEY:-}" \
              -e AWS_S3_BUCKET_NAME="${AWS_S3_BUCKET_NAME:-}" \
              "$IMAGE"

            healthy=false

            for i in $(seq 1 10)
            do
              if curl -fs "http://localhost:$HEALTH_PORT/" > /dev/null
              then
                healthy=true
                break
              fi

              sleep 3
            done

            if [ "$healthy" != "true" ]
            then
              echo "Deployment failed — health check never passed"

              docker logs "$NEW_CONTAINER" || true

              docker rm -f "$NEW_CONTAINER" || true

              exit 1
            fi

            # Docker Stop + Docker Remove — old container comes down only
            # after the new image has proven healthy
            docker rm -f "$CONTAINER" 2>/dev/null || true

            docker rm -f "$NEW_CONTAINER"

            # Docker Run — promote the image to the real port
            docker run -d \
              --name "$CONTAINER" \
              -p 3000:3000 \
              --restart unless-stopped \
              -e NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
              -e NEXT_PUBLIC_SITE_URL="$NEXT_PUBLIC_SITE_URL" \
              -e NEXT_PUBLIC_APP_ENV="$NEXT_PUBLIC_APP_ENV" \
              -e NEXT_PUBLIC_SOCKET_SERVER_URL="$NEXT_PUBLIC_SOCKET_SERVER_URL" \
              -e AWS_REGION="${AWS_REGION:-}" \
              -e AWS_ACCESS_KEY_ID="${UPLOAD_AWS_ACCESS_KEY_ID:-}" \
              -e AWS_SECRET_ACCESS_KEY="${UPLOAD_AWS_SECRET_ACCESS_KEY:-}" \
              -e AWS_S3_BUCKET_NAME="${AWS_S3_BUCKET_NAME:-}" \
              "$IMAGE"

            sleep 2

            curl -fs http://localhost:3000/ > /dev/null

            # Docker Image Cleanup — drop dangling layers from the old image
            docker image prune -f
