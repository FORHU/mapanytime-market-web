name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Type Check, Lint, Validate, Test, Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_APP_ENV: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Verify ProductFormCore imports
        run: |
          echo "Current commit:"
          git rev-parse HEAD

          echo ""
          echo "Searching for old import..."
          grep -R "seller-catalog/components/ProductFormCore" src || true

          echo ""
          echo "Showing AICatalogUpload imports..."
          grep "ProductFormCore" src/features/stores/components/AICatalogUpload.tsx

      - name: Validate architecture boundaries
        run: pnpm validate

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
