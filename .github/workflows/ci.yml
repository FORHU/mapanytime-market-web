name: CI

on:
  workflow_dispatch:

  pull_request:

  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and Validate
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_APP_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fast, cheap checks first so a failure here gives quick feedback
      # without paying for a full production build.
      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Validate architecture boundaries
        run: pnpm validate

      - name: Unit tests
        run: pnpm test

      # Build runs last, once, only after every cheaper check has passed.
      - name: Build
        run: pnpm build
